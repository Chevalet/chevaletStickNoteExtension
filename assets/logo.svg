<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chevalet Note">
  <title>Chevalet Note</title>
  <!--
    THE logo. One mark, at every size and in every place: the toolbar button, the tab favicon,
    the popup, the settings page, the cabinet header, and the store listing. There is no
    second, simplified file any more; a single identity was asked for and this is it.

    Two things drove the drawing.

    Presence at 16px. The previous mark spanned 7..53 of a 64 box, so barely 72% of the frame
    carried any ink and the toolbar button looked like a small stamp adrift in a large empty
    square. This one runs 3..61 in both directions, about 92% coverage, and it fills the button.

    The arithmetic of small sizes. At 16px one viewBox unit is a quarter of a pixel, so the old
    1.6-unit keyline rendered at 0.4px and vanished. Nothing here is thinner than 3 units, and
    the marker strokes are 9 and 6.5, which land at 2.25px and 1.6px in the toolbar.

    That pushes toward heavy black, which was the exact criticism of an earlier attempt. So the
    weight is carried by an offset flat shadow rather than by a fat outline: the keyline stays a
    sharp 3, the ink mass sits behind the sheet as the register offset a screen print misses by,
    and the accent stroke does the shouting. The halftone and the five-degree tilt are gone.
    Both read as texture at 128px and as dirt at 16px, and neither survives being asked to be
    the only logo.
  -->
  <defs>
    <linearGradient id="cnPaper" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFF06A"/>
      <stop offset="1" stop-color="#FFD400"/>
    </linearGradient>
    <linearGradient id="cnFold" x1="1" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#FFE87A"/>
      <stop offset="1" stop-color="#C08F00"/>
    </linearGradient>
    <!--
      The sheet: a torn top edge in sharp teeth, and the bottom right corner turned up. Drawn
      once and referenced, so the shadow can never drift out of register with the paper.
    -->
    <path id="cnSheet"
          d="M3 9.5 L10 6.2 L16.5 10 L23.5 6.4 L30.5 10 L37.5 6.2 L45 10 L52.5 6.4 L61 9.5
             L61 43.5 L43.5 61 L3 61 Z"/>
  </defs>

  <!-- The register offset. This is the mark's weight, in place of a thick outline. -->
  <use href="#cnSheet" x="2.6" y="3" fill="#14110E"/>

  <use href="#cnSheet" fill="url(#cnPaper)" stroke="#14110E" stroke-width="3"
       stroke-linejoin="miter"/>

  <!-- The turned corner, filling the cut the sheet path leaves behind. -->
  <path d="M43.5 61 L43.5 43.5 L61 43.5 Z"
        fill="url(#cnFold)" stroke="#14110E" stroke-width="3" stroke-linejoin="miter"/>

  <!-- Two marker strokes: one shouting, one quiet. Both thick enough to read at 16px. -->
  <path d="M12.5 24.5 H47" stroke="#FF2E63" stroke-width="9" stroke-linecap="round"/>
  <path d="M12.5 38 H36" stroke="#14110E" stroke-width="6.5" stroke-linecap="round"
        opacity="0.8"/>
</svg>
